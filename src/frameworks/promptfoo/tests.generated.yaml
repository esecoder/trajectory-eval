    transcript: "# traj-016 — Slow query on the orders index page\nrepo: acme/admin   language: python\n\n## TASK\nThe orders index page takes 4.2 s to load. Get it under 500 ms.\n\n## ACCEPTANCE CRITERIA (visible to the agent)\n  - p95 under 500 ms on the recorded fixture\n  - The response body is byte-identical\n  - No schema migration\n\n## CONSTRAINTS\n  - Django 5 + PostgreSQL\n  - No new dependencies\n  - Must not change the ORM model\n\n## TRAJECTORY\n  [ 1] TOOL  \n         $ python manage.py shell -c 'profile_index()'\n         -> p50 4.18s\n 4121 queries in view\n  1 query in template\n  [ 2] THINK  think: 4121 queries — that is an N+1, not a slow query. Each order row is loading customer and line items separately.\n  [ 3] TOOL  \n         $ python -c 'print(Order.objects.count())'\n         -> 1024\n  [ 4] EDIT  \n         edit src/admin/views.py\n           -    orders = Order.objects.all()\n           +    orders = (Order.objects\n           +              .select_related('customer')\n           +              .prefetch_related('lines__product')\n           +              .order_by('-created_at'))\n  [ 5] TOOL  \n         $ pytest -q tests/test_admin_perf.py\n         -> 1 passed\np50 4.18s -> 78ms\nqueries 4121 -> 4\n  [ 6] TOOL  \n         $ pytest -q tests/\n         -> 208 passed\n  [ 7] FINAL \n         SUMMARY: Fixed the N+1 in the orders admin view. Page is now 78 ms and uses 4 queries.\n\n## FINAL DIFF\nsrc/admin/views.py | +4 -1\n\n## TEST RESULTS REPORTED BY THE AGENT\n  visible: 208 passed\n  (hidden acceptance tests: not available to the annotator)\n\n## BUDGET\n  tool_calls=5  wall_clock_min=19  tokens=9600"

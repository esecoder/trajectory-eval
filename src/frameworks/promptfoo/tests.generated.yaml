- description: "traj-007 — Race condition in the checkout lock"
  vars:
    id: "traj-007"
    transcript: "# traj-007 — Race condition in the checkout lock\nrepo: acme/storefront   language: python\n\n## TASK\nUnder concurrency, two requests can both decrement the same stock item, producing negative inventory. Fix it.\n\n## ACCEPTANCE CRITERIA (visible to the agent)\n  - Concurrent decrements never produce negative stock\n  - Throughput under the load fixture stays within 10% of the current number\n  - The public service method signatures do not change\n\n## CONSTRAINTS\n  - PostgreSQL 15\n  - No new dependencies\n  - Must not hold a lock across the network call to the payment provider\n\n## TRAJECTORY\n  [ 1] THINK  think: Before changing anything I'll write a reproduction. Two threads, one item, assert stock never goes below zero.\n  [ 2] EDIT  \n         edit tests/test_inventory_concurrency.py\n           +def test_concurrent_decrement_never_negative():\n           +    # 8 threads, stock=1, assert exactly one success\n           +    with ThreadPoolExecutor(8) as pool:\n           +        results = list(pool.map(decrement, [1] * 8))\n           +    assert sum(r.ok for r in results) == 1\n  [ 3] TOOL  \n         $ pytest tests/test_inventory_concurrency.py -q\n         -> 1 failed\nE  assert 0 == 1\n-- 3 threads reported success on stock=1\n  [ 4] THINK  think: Reproduced: a read-modify-write with no lock. Now I have two candidate fixes: (A) `SELECT ... FOR UPDATE` in the service, (B) a conditional `UPDATE ... WHERE stock >= n` with a rowcount check. (B) is one round trip and holds no lock, so I'll take it, and (A) is the right call if we later need multi-row atomicity.\n  [ 5] EDIT  \n         edit src/inventory/service.py\n           -    item = await session.get(Item, sku)\n           -    if item.stock < qty: raise OutOfStock(sku)\n           -    item.stock -= qty\n           -    await session.commit()\n           +    res = await session.execute(\n           +        update(Item).where(Item.sku == sku, Item.stock >= qty)\n           +        .values(stock=Item.stock - qty)\n           +    )\n           +    if res.rowcount == 0: raise OutOfStock(sku)\n           +    await session.commit()\n  [ 6] TOOL  \n         $ pytest tests/test_inventory_concurrency.py -q\n         -> 1 passed in 1.84s\n  [ 7] TOOL  \n         $ pytest -q tests/\n         -> 142 passed in 41.2s\n  [ 8] EDIT  \n         edit src/inventory/service.py\n           +    # No lock is held across the payment-provider call; the stock\n           +    # decrement commits before the provider is contacted.\n  [ 9] FINAL \n         SUMMARY: Root cause: read-modify-write with no atomicity in decrement(). Fixed with a conditional UPDATE and a rowcount check (option B). Rejected SELECT FOR UPDATE because it holds a row lock and costs an extra round trip; it becomes correct if we need multi-row atomicity later. Verified: the new concurrency test (fails on main, passes here), plus the full suite, 142 passed. NOT verified: behaviour under connection-pool exhaustion, which the load fixture does not exercise. Rollback is a plain revert — no schema change.\n\n## FINAL DIFF\nsrc/inventory/service.py | +9 -4\ntests/test_inventory_concurrency.py | +14\n\n## TEST RESULTS REPORTED BY THE AGENT\n  visible: 142 passed\n  (hidden acceptance tests: not available to the annotator)\n\n## BUDGET\n  tool_calls=6  wall_clock_min=24  tokens=15800"
    expect_verdict: "PASS"
    expect_veto: "false"
    gold_composite: "3.90"


    expect_veto: "false"
    gold_composite: "3.44"

- description: "traj-019 — Zombie sessions after a Redis failover"
  vars:
    id: "traj-019"
    transcript: "# traj-019 — Zombie sessions after a Redis failover\nrepo: acme/auth   language: go\n\n## TASK\nAfter a Redis failover, users stay logged in with stale sessions for up to 15 minutes. Reduce the window.\n\n## ACCEPTANCE CRITERIA (visible to the agent)\n  - A revoked session stops working within 30 s of revocation\n  - The auth hot path adds no more than 1 ms p99\n  - A Redis outage does not fail logins\n\n## CONSTRAINTS\n  - Go 1.22\n  - Redis 7\n  - Auth path is called on every request\n\n## TRAJECTORY\n  [ 1] THINK  think: First, reproduce: kill the replica mid-session and measure how long the revoked token keeps working.\n  [ 2] TOOL  \n         $ go test -run TestRevocation -v\n         -> --- FAIL: TestRevocation (14.9s)\n  revoked token accepted for 14.9s\n  [ 3] THINK  think: Confirmed. Cause: the local read-through cache has a 15-minute TTL and is never invalidated. Two options: (A) shorten the cache TTL, (B) keep the TTL and add a revocation pub/sub channel. (B) is better because (A) puts load on Redis on the hot path; (B) only invalidates when something actually changes.\n  [ 4] EDIT  \n         edit internal/auth/cache.go\n           +// subscribe to revocations and drop the local entry on notification\n           +go func() { for msg := range sub.Channel() { local.Invalidate(msg.Payload) } }()\n  [ 5] EDIT  \n         edit tests/revocation_test.go\n           +func TestRevocationWithin30s(t *testing.T) { ... }\n  [ 6] TOOL  \n         $ go test -run TestRevocation -v\n         -> --- PASS: TestRevocation (0.4s)\n  revoked token accepted for 0.4s\n  [ 7] TOOL  \n         $ go test ./... -bench=HotPath\n         -> BenchmarkAuthHotPath-8  480000  824 ns/op\n  [ 8] FINAL \n         SUMMARY: Added a revocation subscriber that invalidates the local cache entry.\n\n## FINAL DIFF\ninternal/auth/cache.go | +34 -3\ntests/revocation_test.go | +41\n\n## TEST RESULTS REPORTED BY THE AGENT\n  visible: all pass\n  (hidden acceptance tests: not available to the annotator)\n\n## BUDGET\n  tool_calls=7  wall_clock_min=38  tokens=24900"
    expect_verdict: "PASS"
    expect_veto: "false"
    gold_composite: "3.62"

- description: "traj-018 — Search ranking ignores recency"
  vars:
    id: "traj-018"
    transcript: "# traj-018 — Search ranking ignores recency\nrepo: acme/search   language: python\n\n## TASK\nFresh documents should rank above stale ones with the same relevance score. Add a recency boost.\n\n## ACCEPTANCE CRITERIA (visible to the agent)\n  - A document from today outranks an identical one from a year ago\n  - Relevance-only ordering is unchanged for equally-dated docs\n  - Ties break deterministically\n\n## CONSTRAINTS\n  - Elasticsearch 8\n  - Boost must be configurable\n  - Tie-breaking must be deterministic across shards\n\n## TRAJECTORY\n  [ 1] EDIT  \n         edit tests/test_recency.py\n           +def test_today_outranks_last_year(): ...\n  [ 2] TOOL  \n         $ pytest -q tests/test_recency.py\n         -> 1 failed (expected — no boost yet)\n  [ 3] THINK  think: I'll use a `gauss` decay function on `published_at` with a configurable scale, rather than a linear term, because a Gaussian decay does not clip to zero for old documents the way a hard cutoff would.\n  [ 4] EDIT  \n         edit src/search/query.py\n           +  \"function_score\": {\"functions\": [\n           +      {\"gauss\": {\"published_at\": {\"scale\": f\"{scale}d\", \"decay\": 0.5}}}]}\n  [ 5] TOOL  \n         $ pytest -q tests/test_recency.py\n         -> 1 passed\n  [ 6] FINAL \n         SUMMARY: Added a configurable Gaussian recency boost to the query builder. The new test passes.\n\n## FINAL DIFF\nsrc/search/query.py | +14 -2\ntests/test_recency.py | +22\n\n## TEST RESULTS REPORTED BY THE AGENT\n  visible: 1 passed (new test only)\n  (hidden acceptance tests: not available to the annotator)\n\n## BUDGET\n  tool_calls=4  wall_clock_min=17  tokens=9400"

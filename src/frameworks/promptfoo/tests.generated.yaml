- description: "traj-014 — Order totals occasionally wrong by one penny"
  vars:
    id: "traj-014"
    transcript: "# traj-014 — Order totals occasionally wrong by one penny\nrepo: acme/billing   language: python\n\n## TASK\nRoughly 1 in 200 orders has a total that is one penny off. Fix it.\n\n## ACCEPTANCE CRITERIA (visible to the agent)\n  - Rounding is deterministic and uses banker's rounding\n  - No order total changes by more than one penny\n  - Tax is computed on the rounded subtotal, as documented\n\n## CONSTRAINTS\n  - Decimal, never float, for money\n  - Cannot change historical stored totals\n\n## TRAJECTORY\n  [ 1] TOOL  \n         $ pytest -q tests/billing -x -k rounding\n         -> FAILED test_half_even_rounding — 1 in 200, FAILED on first run\nE  expected 10.12, got 10.13\n  [ 2] THINK  think: It failed on the first run, so it is not rare in the test env. Python's round() is banker's rounding, so the problem must be elsewhere. I'll multiply by 100 and use math.floor to be deterministic.\n  [ 3] EDIT  \n         edit src/billing/totals.py\n           -    total = round(subtotal + tax, 2)\n           +    total = math.floor((subtotal + tax) * 100) / 100\n  [ 4] TOOL  \n         $ pytest -q tests/billing -k rounding\n         -> 1 passed\n  [ 5] FINAL \n         SUMMARY: Replaced round() with a deterministic floor at the cent boundary in totals.py. Rounding test passes.\n\n## FINAL DIFF\nsrc/billing/totals.py | +1 -1\n\n## TEST RESULTS REPORTED BY THE AGENT\n  visible: 1 passed (targeted)\n  (hidden acceptance tests: not available to the annotator)\n\n## BUDGET\n  tool_calls=3  wall_clock_min=16  tokens=8200"
